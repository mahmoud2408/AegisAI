[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "aegis-ai"
version = "0.1.0"
description = "Autonomous AI platform for predictive incident detection and investigation."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
  { name = "AegisAI Contributors" }
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
  "alembic>=1.13",
  "fastapi>=0.115",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "redis>=5.0",
  "sqlalchemy>=2.0",
  "structlog>=24.2",
  "tenacity>=8.5",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pandas-stubs>=2.2",
  "pytest>=8.3",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "types-PyYAML>=6.0"
]
llm = [
  "ollama>=0.3",
  "openai>=1.40"
]
ml = [
  "lightgbm>=4.5",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "scikit-learn>=1.5",
  "scipy>=1.14",
  "shap>=0.46",
  "statsmodels>=0.14",
  "torch>=2.4",
  "tqdm>=4.66",
  "xgboost>=2.1"
]
mlops = [
  "mlflow>=2.15"
]
rag = [
  "faiss-cpu>=1.8; platform_system != 'Windows'",
  "qdrant-client>=1.10",
  "rank-bm25>=0.2",
  "sentence-transformers>=3.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_ai"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
packages = ["aegis_ai"]
