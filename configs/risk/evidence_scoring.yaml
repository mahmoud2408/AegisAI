# Phase 8B: deterministic evidence engine and risk signal aggregation.

forecasting_run_dir: experiments/forecasting/metropt/phase8_metropt_forecasting_20260915
robustness_prediction_path: experiments/prediction/metropt_robustness/phase7b_metropt_robustness_20260914/predictions.parquet

entity_id: metropt_compressor
source_dataset: metropt

# Use the validation-selected Phase 8 candidate. Residual evidence is emitted at
# target_timestamp, not input_end_timestamp, because it needs the observed future value.
selected_forecast_model: lstm_multivariate
selected_forecast_horizon_minutes: 5
selected_split: test

aggregation_frequency: 5min
trend_lookback_minutes: 30
trend_min_points: 3
historical_context_lookback_minutes: 60
historical_context_min_prior_signals: 3

max_signals_per_type: 5000
max_state_transition_signals: 2000
max_failure_signals: 1500
pre_failure_context_hours: 6

current_anomaly_z_thresholds:
  low: 2.5
  medium: 3.0
  high: 4.0
  critical: 5.0

forecast_residual_z_thresholds:
  low: 1.0
  medium: 1.5
  high: 2.5
  critical: 4.0

trend_z_thresholds:
  low: 0.8
  medium: 1.2
  high: 2.0
  critical: 3.0

# Phase 7B MetroPT failure-prediction evidence is explicitly research-only.
failure_probability_thresholds:
  low: 0.02
  medium: 0.05
  high: 0.10
  critical: 0.20

historical_count_thresholds:
  low: 3
  medium: 5
  high: 8
  critical: 12

risk_severity_thresholds:
  low: 0.15
  medium: 0.35
  high: 0.60
  critical: 0.80

signal_type_weights:
  CURRENT_ANOMALY: 1.00
  FORECAST_DEVIATION: 0.90
  TREND: 0.65
  FAILURE_SIGNAL: 0.30
  STATE_TRANSITION: 0.35
  HISTORICAL_CONTEXT: 0.45
  LOG_RARE_EVENT: 0.25
  LOG_FREQUENCY_ANOMALY: 0.45
  LOG_LEVEL_ANOMALY: 0.40
  LOG_SEQUENCE_ANOMALY: 0.35
  LOG_COMPONENT_ANOMALY: 0.40

reliability_weights:
  HIGH: 1.00
  MEDIUM: 0.75
  LOW: 0.45
  RESEARCH_ONLY: 0.15

source_reliability:
  metropt:train_normal_range_rule: MEDIUM
  metropt:lstm_multivariate: MEDIUM
  metropt:moving_average: MEDIUM
  metropt:rolling_trend_rule: LOW
  metropt:state_transition_rule: LOW
  metropt:historical_context_rule: LOW
  metropt:metropt_failure_prediction: RESEARCH_ONLY
  loghub-openstack:rare_event_detector: LOW
  loghub-openstack:frequency_deviation_detector: LOW
  loghub-openstack:log_level_distribution_detector: LOW
  loghub-openstack:transition_rarity_detector: LOW
  loghub-openstack:component_activity_detector: LOW
  loghub-hdfs:rare_event_detector: LOW
  loghub-hdfs:frequency_deviation_detector: LOW
  loghub-hdfs:log_level_distribution_detector: LOW
  loghub-hdfs:transition_rarity_detector: LOW
  loghub-hdfs:component_activity_detector: LOW
  loghub-hadoop:rare_event_detector: LOW
  loghub-hadoop:frequency_deviation_detector: LOW
  loghub-hadoop:log_level_distribution_detector: LOW
  loghub-hadoop:transition_rarity_detector: LOW
  loghub-hadoop:component_activity_detector: LOW
  loghub-spark:rare_event_detector: LOW
  loghub-spark:frequency_deviation_detector: LOW
  loghub-spark:log_level_distribution_detector: LOW
  loghub-spark:transition_rarity_detector: LOW
  loghub-spark:component_activity_detector: LOW
  loghub-zookeeper:rare_event_detector: LOW
  loghub-zookeeper:frequency_deviation_detector: LOW
  loghub-zookeeper:log_level_distribution_detector: LOW
  loghub-zookeeper:transition_rarity_detector: LOW
  loghub-zookeeper:component_activity_detector: LOW
  loghub-bgl:rare_event_detector: LOW
  loghub-bgl:frequency_deviation_detector: LOW
  loghub-bgl:log_level_distribution_detector: LOW
  loghub-bgl:transition_rarity_detector: LOW
  loghub-bgl:component_activity_detector: LOW
