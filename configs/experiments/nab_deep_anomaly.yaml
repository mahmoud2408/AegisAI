train_fraction: 0.5
validation_fraction: 0.2
random_seed: 42
max_series:

threshold:
  strategy: train_percentile
  percentile: 99.0

data:
  feature_set: raw
  normalization: standard
  exclude_train_anomalies: true

windowing:
  sequence_length: 32
  stride: 1

feature_config:
  short_window: 5
  long_window: 20
  trend_window: 5
  min_periods: 3
  epsilon: 1.0e-8

zscore_config:
  score_column: rolling_zscore_long
  threshold_quantile: 0.99

isolation_forest_config:
  n_estimators: 200
  max_samples: auto
  contamination: auto
  random_state: 42
  n_jobs: -1

dense_autoencoder_config:
  hidden_dims: [32, 16]
  latent_dim: 8
  learning_rate: 0.001
  batch_size: 128
  epochs: 4
  patience: 2
  min_delta: 1.0e-5
  random_seed: 42
  device: cpu

lstm_autoencoder_config:
  hidden_size: 16
  num_layers: 1
  dropout: 0.0
  learning_rate: 0.001
  batch_size: 128
  epochs: 4
  patience: 2
  min_delta: 1.0e-5
  random_seed: 42
  device: cpu

ablation:
  enabled: true
  max_series: 6
  dense_epochs: 2
  variants:
    - name: main_protocol
    - name: window_16
      sequence_length: 16
    - name: no_normalization
      normalization: none
    - name: causal_features
      feature_set: causal
    - name: validation_threshold
      threshold_strategy: validation_percentile
