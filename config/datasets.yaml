  - id: opentelemetry-demo
    name: OpenTelemetry Demo Reference Resources
    category: observability_reference
    description: Small public OpenTelemetry demo configuration and generator resources useful for future synthetic telemetry work.
    official_source: https://github.com/openobserve/opentelemetry-demo-dataset
    download_method: github_selected_files
    download_url: https://github.com/openobserve/opentelemetry-demo-dataset
    destination: data/raw/opentelemetry
    expected_files:
      - README.md
      - src/log-generator/app.py
      - src/otel-collector/otelcol-config.yml
      - src/prometheus/prometheus-config.yaml
    requires_manual_access: false
    safe_default: true
    large: false
    license: Apache License 2.0 in the upstream repository.
    notes: The inspected repository is a runnable demo, not a static telemetry benchmark. Only small reference files are downloaded by default.
    aliases:
      - opentelemetry
      - otel

  - id: metropt
    name: MetroPT-3 Dataset
    category: predictive_maintenance_time_series
    description: Multivariate metro train compressor telemetry for predictive maintenance and anomaly explanation.
    official_source: https://archive.ics.uci.edu/dataset/791/metropt%2B3%2Bdataset
    download_method: direct_archive
    download_url: https://archive.ics.uci.edu/static/public/791/metropt+3+dataset.zip
    destination: data/raw/metropt
    expected_files:
      - MetroPT3(AirCompressor).csv
      - Data Description_Metro.pdf
    requires_manual_access: false
    safe_default: true
    large: false
    license: Creative Commons Attribution 4.0 International (CC BY 4.0).
    notes: Preserve the original CSV and official description file.
    aliases:
      - metropt-3
      - metropt3

