datasets:
  - id: nab
    name: Numenta Anomaly Benchmark
    category: univariate_time_series_anomaly_detection
    description: Labeled real-world and artificial streaming time-series benchmark for anomaly detection.
    official_source: https://github.com/numenta/NAB
    download_method: github_tree
    download_url: https://github.com/numenta/NAB
    destination: data/raw/nab
    expected_files:
      - data/realAWSCloudwatch/ec2_cpu_utilization_24ae8d.csv
      - labels/combined_windows.json
    requires_manual_access: false
    safe_default: true
    large: false
    license: MIT license in the upstream repository.
    notes: Downloads only the upstream data, labels, README, and license files; raw data is not transformed.
    aliases:
      - numenta

  - id: smd
    name: Server Machine Dataset
    category: multivariate_time_series_anomaly_detection
    description: Multivariate server telemetry dataset distributed with OmniAnomaly.
    official_source: https://github.com/das2ar/OmniAnomaly
    download_method: github_tree
    download_url: https://github.com/das2ar/OmniAnomaly/tree/master/ServerMachineDataset
    destination: data/raw/smd
    expected_files:
      - train/*.txt
      - test/*.txt
      - test_label/*.txt
    requires_manual_access: false
    safe_default: true
    large: false
    license: To verify from upstream repository and original SMD publication.
    notes: Preserves train, test, test_label, interpretation_label, and LICENSE from ServerMachineDataset.
    aliases:
      - server-machine-dataset

  - id: smap-msl
    name: SMAP and MSL Telemanom Bundle
    category: multivariate_spacecraft_telemetry_anomaly_detection
    description: NASA SMAP satellite and MSL rover telemetry anomaly data used by Telemanom.
    official_source: https://github.com/khundman/telemanom
    download_method: direct_archive
    download_url: https://s3-us-west-2.amazonaws.com/telemanom/data.zip
    destination: data/raw/smap_msl
    expected_files:
      - data.zip
      - labeled_anomalies.csv
    requires_manual_access: false
    safe_default: true
    large: false
    license: To verify from Telemanom and original data providers.
    notes: The label CSV is downloaded from the Telemanom GitHub repository. If the historical S3 archive is unavailable, validation will report the data bundle as incomplete.
    aliases:
      - smap
      - msl
      - smap_msl
      - smap-msl

  - id: loghub-hdfs
    name: LogHub HDFS 2k Sample
    category: log_analytics
    description: Small HDFS log sample with parsed structured and template files from LogHub.
    official_source: https://github.com/logpai/loghub
    download_method: github_tree
    download_url: https://github.com/logpai/loghub/tree/master/HDFS
    destination: data/raw/loghub/hdfs
    expected_files:
      - HDFS_2k.log
      - HDFS_2k.log_structured.csv
      - HDFS_2k.log_templates.csv
      - README.md
    requires_manual_access: false
    safe_default: true
    large: false
    license: Freely available for research or academic work; cite LogHub where applicable.
    notes: Downloads the repository sample, not the multi-GB full HDFS release.
    aliases:
      - hdfs

